; TEMPLATE da top bar da Tarsila. Os tokens __MAIUSCULOS__ são
; substituídos por tarsila-ob-bar.sh (que lê tema+resolução) gerando o
; config.gen.ini efetivo. As cores dos pontos (aceso/apagado) vêm por
; variável de ambiente (TB_FG/TB_DIM) lida por dots.sh em tempo de execução.

[bar/tarsila]
width = 100%
height = 34
background = #EDF1F4
foreground = #2a2e32
line-size = 0
padding-left = 1
padding-right = 2
module-margin = 2
wm-restack = generic
override-redirect = false
enable-ipc = true

font-0 = DejaVu Sans:size=11;3
font-1 = DejaVu Sans:style=Bold:size=11;3
font-2 = FontAwesome:size=11;2
font-3 = DejaVu Sans:size=13;3
font-4 = Symbols Nerd Font:size=40;3

modules-left = buttons title
modules-center =
modules-right = limpar sound netw systray date power

[module/title]
type = custom/script
exec = /home/alan/.config/polybar/title.sh
tail = true

[module/buttons]
type = custom/script
exec = /home/alan/.config/polybar/buttons.sh
tail = true

[module/limpar]
type = custom/script
exec = /home/alan/.config/polybar/limpar-btn.sh
tail = true
click-left = /usr/local/bin/tarsila-limpar.sh

; linha separadora (cor gelo/sutil) que divide o lado esquerdo do bloco de
; status (rede/relogio/energia) na direita
[module/sep]
type = custom/text
content = "│"
content-foreground = #9aa4ac
content-padding = 1

; (dots antigo — mantido definido mas fora da barra; a navegacao por
;  bolinhas foi substituida pelo botao "Limpar Area de Trabalho")
[module/dots]
type = custom/script
exec = /home/alan/.config/polybar/dots.sh
tail = true

[module/netw]
type = custom/script
exec = /home/alan/.config/polybar/net.sh
interval = 5
click-left = /usr/local/bin/tarsila-barra-menu rede

[module/sound]
type = custom/script
exec = /home/alan/.config/polybar/sound.sh
interval = 3
click-left = /usr/local/bin/tarsila-barra-menu som
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/systray]
type = internal/tray
tray-size = 66%
tray-spacing = 6px

[module/date]
type = internal/date
interval = 10
date = %H:%M
date-alt = %a %d/%m
label = %date%

[module/power]
type = custom/script
exec = /home/alan/.config/polybar/power.sh
click-left = /usr/local/bin/tarsila-ob-power.sh
