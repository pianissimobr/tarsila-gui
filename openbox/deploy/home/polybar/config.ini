; TEMPLATE da top bar da Tarsila. Os tokens __MAIUSCULOS__ são
; substituídos por tarsila-ob-bar.sh (que lê tema+resolução) gerando o
; config.gen.ini efetivo. As cores dos pontos (aceso/apagado) vêm por
; variável de ambiente (TB_FG/TB_DIM) lida por dots.sh em tempo de execução.

[bar/tarsila]
width = 100%
height = __HEIGHT__
background = __BG__
foreground = __FG__
line-size = 0
padding-left = 1
padding-right = 2
module-margin = 2
wm-restack = generic
override-redirect = false
enable-ipc = true

font-0 = DejaVu Sans:size=__FONT__;3
font-1 = DejaVu Sans:style=Bold:size=__FONT__;3
font-2 = FontAwesome:size=__ICON__;2
font-3 = DejaVu Sans:size=__DOT__;3

modules-left = title buttons
modules-center = dots
modules-right = sound netw systray date power

[module/title]
type = custom/script
exec = __HOME__/.config/polybar/title.sh
tail = true

[module/buttons]
type = custom/script
exec = __HOME__/.config/polybar/buttons.sh
tail = true

[module/dots]
type = custom/script
exec = __HOME__/.config/polybar/dots.sh
tail = true

[module/netw]
type = custom/script
exec = __HOME__/.config/polybar/net.sh
interval = 5
click-left = nm-connection-editor

[module/sound]
type = custom/script
exec = __HOME__/.config/polybar/sound.sh
interval = 3
click-left = pavucontrol
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/systray]
type = internal/tray
tray-size = 66%
tray-spacing = 6px

[module/date]
type = internal/date
interval = 10
date = %H:%M
date-alt = %a %d/%m
label = %date%

[module/power]
type = custom/script
exec = __HOME__/.config/polybar/power.sh
click-left = /usr/local/bin/tarsila-ob-power.sh
