; TEMPLATE da top bar da Tarsila. Os tokens __MAIUSCULOS__ sao
; substituidos por tarsila-ob-bar.sh gerando o config.gen.ini efetivo.
;
; Largura/offset/modules-left: ajustados em runtime por tarsila-polybar-mode.sh
; (compact = direita ate o calendario; full = 100% no maximizado).

[bar/tarsila]
width = 100%
offset-x = 0
height = __HEIGHT__
background = __BG__
foreground = __FG__
line-size = 0
padding-left = 1
padding-right = 2
module-margin = 2
wm-restack = generic
override-redirect = false
enable-ipc = true

font-0 = DejaVu Sans:size=__FONT__;3
font-1 = DejaVu Sans:style=Bold:size=__FONT__;3
font-2 = FontAwesome:size=__ICON__;2
font-3 = DejaVu Sans:size=__DOT__;3
font-4 = Symbols Nerd Font:size=__CAP__;3
font-5 = Roboto:style=Regular:size=__DATE__;3

modules-left = topbar
modules-center =
modules-right = date triangulo limpar sound netw power

[module/topbar]
type = custom/script
exec = __HOME__/.config/polybar/topbar.sh
tail = true

[module/triangulo]
type = custom/text
content = ▼
click-left = /usr/local/bin/tarsila-barra-menu sistema

[module/limpar]
type = custom/text
content = %{T3}%{T-}
click-left = /usr/local/bin/tarsila-limpar.sh

[module/sep]
type = custom/text
content = "│"
content-foreground = __SEP__
content-padding = 1

[module/netw]
type = custom/script
exec = __HOME__/.config/polybar/net.sh
interval = 5
click-left = /usr/local/bin/tarsila-barra-menu rede

[module/sound]
type = custom/script
exec = __HOME__/.config/polybar/sound.sh
interval = 3
click-left = /usr/local/bin/tarsila-barra-menu som
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/date]
type = custom/script
exec = __HOME__/.config/polybar/date.sh
interval = 30
format = %{T6}<label>%{T-}
click-left = /usr/local/bin/tarsila-barra-menu calendario

[module/power]
type = custom/script
exec = __HOME__/.config/polybar/power.sh
click-left = /usr/local/bin/tarsila-ob-power.sh
