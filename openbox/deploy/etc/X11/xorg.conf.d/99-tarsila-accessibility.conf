# Tarsila: teclado do usuario leigo (br, pc105).
#
# ATENCAO: NAO pôr "terminate:ctrl_alt_bksp" em XkbOptions.
# Essa opcao LIGA o Ctrl+Alt+Backspace, que mata a sessao X na hora, sem
# confirmacao, e o usuario perde tudo que estava aberto. Em 12/08/2026 ela
# foi posta aqui por engano, num arquivo cujo proprio comentario dizia que
# servia para PROTEGER o leigo.
#
# Sticky Keys (5x Shift) continua pendente: nao se desliga por XkbOptions,
# precisa do pacote xkbset (`xkbset -a` + `xkbset exp 1 =a` no autostart).
Section "InputClass"
    Identifier "Tarsila keyboard defaults"
    MatchIsKeyboard "on"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "br"
    Option "XkbOptions" ""
EndSection
