# Picom xrender da sessão Tarsila-Openbox (tvbox Mali-G31).
# Backend leve — sem GLX (glx + corner-radius congela nesta GPU).
# Cantos arredondados só em janelas flutuantes; maximizadas/dock/barra ficam de fora.

backend = "xrender";
vsync = false;
use-damage = true;

# Cantos retos (2026-07-28). O arredondamento cortava justamente o pixel da
# borda na curva, e a janela voltava a se perder no fundo bem no canto. Com
# canto reto o contorno do tema fecha o quadro inteiro, que era o objetivo.
corner-radius = 0;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'toolbar'",
  "window_type = 'utility'",
  "window_type = 'splash'",
  "window_type = 'notification'",
  "class_g = 'Polybar'",
  "class_g = 'Plank'",
  "class_g = 'Dunst'",
  "fullscreen",
  "_NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_HORZ'"
];

# Sem sombra: foi testada para resolver o canto arredondado (a borda de 1px
# some justamente na curva) e resolvia, mas custava 4% de CPU continuos
# contra 0,5% sem ela, nesta GPU. Nao compensa.
shadow = false;
fading = false;

# Tarsila 2026-07-26: video em tela cheia ignora o compositor (26 -> 33 fps).
unredir-if-possible = true;
