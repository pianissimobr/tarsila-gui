; TEMPLATE da top bar da Tarsila. Os tokens __MAIUSCULOS__ são
; substituídos por tarsila-ob-bar.sh (que lê tema+resolução) gerando o
; config.gen.ini efetivo. As cores dos pontos (aceso/apagado) vêm por
; variável de ambiente (TB_FG/TB_DIM) lida por dots.sh em tempo de execução.

[bar/tarsila]
width = 100%
height = 34
background = #00000000
foreground = #2a2e32
line-size = 0
padding-left = 1
padding-right = 2
module-margin = 2
wm-restack = generic
override-redirect = false
enable-ipc = true

font-0 = DejaVu Sans:size=11;3
font-1 = DejaVu Sans:style=Bold:size=11;3
font-2 = FontAwesome:size=11;2
font-3 = DejaVu Sans:size=13;3
font-4 = Symbols Nerd Font:size=40;3

modules-left = buttons title
modules-center =
; A bandeja fica entre a data e o botao limpar: e ali que aparecem os icones
; que alguns programas criam enquanto rodam (o VLC, por exemplo). Como ela
; costuma estar vazia, o resto da sequencia nao se mexe por causa dela.
modules-right = date systray limpar sound netw power

[module/title]
type = custom/script
exec = /home/alan/.config/polybar/title.sh
tail = true

[module/buttons]
type = custom/script
exec = /home/alan/.config/polybar/buttons.sh
tail = true

[module/limpar]
; Era um script em laco, que so mostrava o botao quando havia janela aberta e
; pintava um fundo cinza atras do icone. Agora o botao e permanente e sem
; fundo, entao nao ha nada para decidir em tempo de execucao: virou texto
; fixo, e um processo a menos rodando o tempo todo.
type = custom/text
content = %{T3}%{T-}
click-left = /usr/local/bin/tarsila-limpar.sh

[module/sep]
type = custom/text
content = "│"
content-foreground = #9aa4ac
content-padding = 1

; (dots antigo — mantido definido mas fora da barra; a navegacao por
;  bolinhas foi substituida pelo botao "Limpar Area de Trabalho")
[module/dots]
type = custom/script
exec = /home/alan/.config/polybar/dots.sh
tail = true

[module/netw]
type = custom/script
exec = /home/alan/.config/polybar/net.sh
interval = 5
click-left = /usr/local/bin/tarsila-barra-menu rede

[module/sound]
type = custom/script
exec = /home/alan/.config/polybar/sound.sh
interval = 3
click-left = /usr/local/bin/tarsila-barra-menu som
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/systray]
type = internal/tray
tray-size = 66%
tray-spacing = 6px

[module/date]
; O relogio interno do polybar ignora o idioma: ele nao chama setlocale, e
; entao o %B saia sempre em ingles ("28 de July") num sistema em portugues.
; Chamar o date do sistema resolve, porque ele respeita o LC_TIME que o
; tarsila-ob-bar.sh exporta -- e que vem do idioma escolhido pelo usuario.
; Custa um processo a cada 30s, e mesmo assim ficamos com um a menos do que
; antes: o botao Limpar deixou de precisar do laco que o vigiava.
type = custom/script
exec = date '+%H:%M  %d de %B'
interval = 30
; Clicar mostra um calendario do mes logo abaixo, que some ao clicar fora.
click-left = /usr/local/bin/tarsila-barra-menu calendario

[module/power]
type = custom/script
exec = /home/alan/.config/polybar/power.sh
click-left = /usr/local/bin/tarsila-ob-power.sh
