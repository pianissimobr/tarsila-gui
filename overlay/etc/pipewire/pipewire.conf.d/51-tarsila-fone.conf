# Tarsila — expõe a saída analógica (fone P2) como sink gráfico.
# A placa aq222 (Amlogic axg-sound-card) só oferece perfil ACP "HDMI" e o
# bruto "Pro Audio"; não há perfil analog-stereo. O caminho do fone já está
# roteado no ALSA (TOACODEC INPUT SRC=TDMC / FRDDR_A SINK 3 SEL=OUT 2 /
# TDMOUT_C SRC SEL=IN 0, persistido em asound.state). Aqui abrimos direto o
# dai-link-0 (hw:0,0) e o publicamos como um sink amigável, ao lado do HDMI.
context.objects = [
    {   factory = adapter
        args = {
            factory.name       = api.alsa.pcm.sink
            node.name          = "tarsila_fone_p2"
            node.description   = "Fone de ouvido (P2)"
            node.nick          = "Fone de ouvido"
            media.class        = Audio/Sink
            api.alsa.path      = "hw:0,0"
            audio.channels     = 2
            audio.position     = [ FL FR ]
            api.alsa.period-size = 1024
            api.alsa.headroom  = 8192
            node.pause-on-idle = false
            priority.driver    = 900
            priority.session   = 900
            device.icon-name   = "audio-headphones"
        }
    }
]
