# Sem RTC de hardware, a TV box sempre acorda com a hora salva pelo
# fake-hwclock (a última vez que esteve ligada) e só corrige quando o
# systemd-timesyncd conseguir falar com um servidor NTP. Medido em 21/08
# numa das boxes de teste: usando só o pool padrão do Debian, isso ficou
# quase uma hora tomando timeout contra dezenas de IPs diferentes antes de
# sincronizar -- a rede daquele teste demorava a liberar UDP/123 para fora.
#
# Aqui a lista fica maior e mais variada, priorizando NTP.br (infra
# brasileira, RTT mais baixo) e dois anycast grandes antes de cair no pool
# genérico do Debian como reserva.
[Time]
NTP=a.ntp.br b.ntp.br c.ntp.br gps.ntp.br
FallbackNTP=time.cloudflare.com time.google.com 0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org
