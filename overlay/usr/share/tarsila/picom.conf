# Picom da sessão Tarsila-Openbox — referência / experimento.
#
# NÃO usar este arquivo no autostart da tvbox de referência (Mali-G31):
# backend glx + corner-radius congela a sessão (~45% CPU contínuo).
# O launcher tarsila-ob-picom.sh sobe xrender sem este conf.
#
# Em GPUs com GLX estável, dá para testar:
#   picom -b --config /usr/share/tarsila/picom.conf

backend = "glx";
vsync = false;
use-damage = false;

corner-radius = 12;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'toolbar'",
  "window_type = 'utility'",
  "window_type = 'splash'",
  "window_type = 'notification'",
  "class_g = 'Polybar'",
  "class_g = 'Plank'",
  "class_g = 'Dunst'",
  "fullscreen",
  "_NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_HORZ'"
];

shadow = false;
fading = false;
